<style>
:root, [data-theme="dark"]{
  --bg1:#000;--bg2:#0a0a0a;--card:rgba(255,255,255,.07);--line:rgba(245,197,24,.45);
  --gold:#f5c518;--txt:#f6f1e1;--mut:#b5ad98;--red:#ff8a98;--grn:#7be0a4;--blu:#6eb5ff;
  --ok-bg:rgba(123,224,164,.15);--warn-bg:rgba(245,197,24,.12);--err-bg:rgba(255,138,152,.12);
  --shadow:0 4px 20px rgba(0,0,0,.4);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg1:#ffffff;--bg2:#f7f7f7;--card:#ffffff;--line:rgba(0,0,0,.12);
  --gold:#b8860b;--txt:#1a1a1a;--mut:#5c5c5c;--red:#c62828;--grn:#2e7d32;--blu:#1565c0;
  --ok-bg:rgba(46,125,50,.1);--warn-bg:rgba(184,134,11,.1);--err-bg:rgba(198,40,40,.08);
  --shadow:0 2px 12px rgba(0,0,0,.08);
  color-scheme:light;
}
[data-theme="light"] body{background:#ffffff}
[data-theme="light"] .card{background:#fff;border-color:rgba(0,0,0,.1);box-shadow:0 1px 8px rgba(0,0,0,.06)}
[data-theme="light"] nav#navTabs{background:#f0f0f0;border-color:rgba(0,0,0,.08)}
[data-theme="light"] nav#navTabs button.on{background:var(--gold);color:#fff}
[data-theme="light"] input, [data-theme="light"] .loss-in, [data-theme="light"] .ready-in{
  background:#f5f5f5;color:#1a1a1a;border-color:rgba(0,0,0,.15)
}
[data-theme="light"] .report-card{background:#fafafa;border-color:rgba(0,0,0,.1)}
[data-theme="light"] .sumitem{background:#f5f5f5;border-color:rgba(184,134,11,.4)}
[data-theme="light"] .theme-btn{background:#fff;border-color:rgba(0,0,0,.12)}

:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
/* حركات بسيطة */
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.96)}}
@keyframes pulseOk{0%,100%{box-shadow:0 0 0 0 rgba(123,224,164,.4)}50%{box-shadow:0 0 0 6px rgba(123,224,164,0)}}
.anim-in{animation:fadeSlideIn .28s ease both}
.anim-out{animation:fadeOut .2s ease both}
.status-ok{background:var(--ok-bg)!important;border-color:var(--grn)!important}
.status-warn{background:var(--warn-bg)!important;border-color:var(--gold)!important}
.status-err{background:var(--err-bg)!important;border-color:var(--red)!important}
.report-wrap{padding:16px 14px}
.report-head{text-align:center;margin-bottom:14px}
.report-title{color:var(--gold);font-size:18px;font-weight:700;letter-spacing:.3px}
.report-sub{color:var(--mut);font-size:12px;margin-top:4px}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.report-card{
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;
  padding:16px 10px;text-align:center;animation:fadeSlideIn .3s ease both
}
[data-theme="light"] .report-card{background:rgba(255,255,255,.7)}
.report-card .num{font-size:28px;font-weight:700;color:var(--gold);display:block;margin:6px 0 2px;line-height:1.1}
.report-card .lbl{font-size:12px;color:var(--mut);display:block}
.report-card .sub{font-size:11px;color:var(--mut);opacity:.85;margin-top:2px}
.report-card.ok .num{color:var(--grn)}
.report-card.warn .num{color:var(--gold)}
.report-card.err .num{color:var(--red)}
.report-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.report-btn{width:100%;padding:12px 10px;font-size:14px;border-radius:12px;font-weight:700}
.report-foot{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding-top:10px;border-top:1px solid rgba(255,255,255,.06);font-size:11px;color:var(--mut)
}
.link-btn{
  background:transparent;border:none;color:var(--gold);font-size:12px;font-weight:700;
  cursor:pointer;padding:4px 8px;border-radius:8px
}
.link-btn:active{opacity:.7}
.report-recent{font-size:13px}
.report-recent .measline{margin:6px 0}
.theme-btn{
  position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:90;
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--gold);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)
}

[class*="netlify"],
[id*="netlify"],
[data-netlify],
iframe[src*="netlify"] {
  display: none !important;
  visibility: hidden !important;
  opacity: 0 !important;
  pointer-events: none !important;
}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:#000;color:var(--txt);font-family:Tajawal,system-ui,sans-serif;padding:0 14px 96px}
body { padding-bottom: env(safe-area-inset-bottom, 0px); }

h1{font-family:'Reem Kufi',serif;color:var(--gold);font-size:42px;letter-spacing:3px;margin:14px 0 0;text-align:center;direction:ltr}
.sub{text-align:center;color:var(--grn);font-size:13px;margin:0 0 12px;border-bottom:1px solid var(--line);padding-bottom:10px;font-weight:bold}
button,select,input,textarea{font:inherit;color:var(--txt)}
button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px;touch-action:manipulation}
.g{background:var(--gold);color:#2a1a00;font-weight:700}
.o{background:transparent;border:1px solid var(--line);color:var(--gold)}
.danger{background:transparent;border:1px solid var(--red);color:var(--red)}
select,input,textarea{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:9px;width:100%;min-height:42px;outline:none}
input:focus,select:focus{border-color:var(--gold)}
input[type="number"],input[type="date"]{direction:ltr;text-align:center}
input[type="checkbox"]{width:18px;height:18px;accent-color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}
.card h3{margin:0 0 6px;color:var(--gold);font-size:18px;font-weight:700}
.cardSummary{font-size:13px;color:#ddd;margin-top:2px;line-height:1.5}
label.l{display:block;font-size:12px;color:var(--mut);margin:0 0 3px}
.mut{color:var(--mut);text-align:center;margin:20px 0;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
@media (max-width:400px){.grid3{grid-template-columns:1fr 1fr}}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:rgba(0,0,0,.25)}
.finishbox{border:1px solid var(--line);border-radius:10px;padding:8px}
.finishbox label{display:flex;align-items:center;gap:6px;font-size:13px;min-height:32px}
.reqbox{
  border:1.5px solid var(--gold);border-radius:12px;background:rgba(245,197,24,.08);
  padding:8px 12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;
}
.reqbox label.l{margin:0;color:var(--gold);font-size:13px;font-weight:700}
.reqbox input{width:90px;font-size:20px;font-weight:700;text-align:center;border-color:var(--gold);min-height:38px;padding:4px}
.syncbar{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-size:12px;color:var(--mut);margin:0 0 10px;padding:8px 12px;
  border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.03)
}
.syncbar.ok{color:var(--grn)}
.syncbar.err{color:var(--red)}
.syncbar .g,.syncbar .o{padding:6px 12px;font-size:12px;min-height:34px}
.daterow{display:flex;align-items:center;gap:4px;direction:ltr}
.daterow .dpart{width:auto;flex:1;min-width:0;text-align:center;padding:10px 4px}
.daterow .dsep{color:var(--gold);font-weight:700;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid rgba(255,255,255,.08);padding:10px 6px;text-align:center}
th{color:var(--mut);font-weight:600}
.tblwrap{overflow-x:auto}
.tbl2block{margin-bottom:12px}
.tbl-title{color:var(--gold);font-weight:700;margin:0 0 8px;font-size:16px;text-align:right}
.sumbox{display:flex;justify-content:center;margin:6px 0;gap:6px;flex-wrap:wrap}
.sumitem{
  background:rgba(0,0,0,.35);border:1.5px solid var(--gold);border-radius:12px;
  padding:8px 16px;text-align:center;min-width:90px
}
.sumitem b{display:block;color:var(--gold);font-size:22px}
.sumitem span{font-size:11px;color:var(--mut)}
.sumitem.ready{border-color:var(--grn)}
.sumitem.ready b{color:var(--grn)}
.arrow{text-align:center;color:var(--gold);margin:4px 0;font-size:16px}
.loss-in{
  width:76px;min-height:40px;text-align:center;direction:ltr;
  background:rgba(255,255,255,.07);color:var(--txt);border:1px solid var(--line);
  border-radius:10px;padding:6px 8px;font-size:15px;font-weight:700
}
.ready-in{
  width:80px;min-height:40px;text-align:center;direction:ltr;
  background:rgba(255,255,255,.07);color:var(--grn);border:1.5px solid var(--grn);
  border-radius:10px;padding:6px 8px;font-size:18px;font-weight:700
}
.measline{
  background:rgba(0,0,0,.25);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;margin:6px 0;font-size:13px;
  display:flex;justify-content:space-between;align-items:center
}
.measline .val{color:var(--gold);font-size:20px;font-weight:700}
.segrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}
.segbtn{
  padding:10px;text-align:center;border:1px solid var(--line);
  border-radius:10px;color:var(--mut);font-weight:700;cursor:pointer;
  font-size:13px;background:rgba(255,255,255,.05);min-height:42px
}
.segbtn.active{background:var(--gold);color:#2a1a00;border-color:var(--gold)}
.photothumb{width:42px;height:42px;object-fit:cover;border-radius:8px;border:1px solid var(--gold)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.actions .span2{grid-column:1/-1}
.hero{text-align:center;padding:22px 14px}
.hero h2{color:var(--gold);font-size:22px;margin:0 0 6px}
.hero p{color:var(--mut);font-size:13px;line-height:1.5;margin:0 0 14px}
#toast{
  position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  background:var(--gold);color:#2a1a00;padding:8px 18px;border-radius:20px;
  font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200;max-width:90%;text-align:center
}
/* شريط الصفحات في الأعلى */
nav#navTabs{
  display:flex;
  justify-content:center;
  gap:4px;
  margin:10px 12px 14px;
  padding:5px;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--line);
  border-radius:16px;
  position:relative;
  z-index:40;
}
nav#navTabs button{
  flex:1;
  background:transparent;
  color:var(--mut);
  border:none;
  border-radius:12px;
  padding:10px 6px;
  font-size:13px;
  font-weight:600;
  transition:all .2s ease;
  position:relative;
}
nav#navTabs button.on{
  color:#1a1200;
  background:var(--gold);
  font-weight:700;
  box-shadow:0 2px 10px rgba(245,197,24,0.35);
}
nav#navTabs button:active{
  transform:scale(0.97);
}
.page{display:none;max-width:520px;margin:0 auto}
.page.active{display:block}

.logo{display:flex;justify-content:center;margin-bottom:2px}
.logo svg{width:48px;height:48px}

/* ===== صفحة الوزن ===== */
.w-table{width:100%;border-collapse:collapse;margin-top:8px}
.w-table th{color:var(--gold);font-weight:700;padding:10px 4px;border-bottom:1.5px solid var(--line);font-size:14px}
.w-table td{padding:6px 3px;vertical-align:middle;border-bottom:1px solid rgba(255,255,255,.06)}
.w-table .col-val{width:38%}
.w-table .col-time{width:12%;text-align:center}
.w-table .col-val2{width:38%}
.w-table .col-time2{width:12%;text-align:center}
.w-row{display:flex;align-items:center;gap:4px;min-height:44px}
.w-input{
  flex:1;background:transparent;border:0;border-bottom:1px dashed rgba(245,197,24,.35);
  border-radius:0;padding:8px 4px;font-size:16px;font-weight:700;text-align:center;
  min-height:40px;color:var(--txt);direction:ltr
}
.w-input:focus{border-bottom-color:var(--gold);outline:none}
.w-input.starred{color:var(--gold)}
.w-time{
  font-size:10px;color:var(--mut);text-align:center;min-width:42px;
  padding:4px 2px;border-radius:6px;cursor:pointer;opacity:0;transition:opacity .2s;
  user-select:none
}
.w-time.show{opacity:1;background:rgba(245,197,24,.12);color:var(--gold)}
.w-time:active{opacity:1}
.w-star{font-size:14px;color:var(--gold);min-width:18px;text-align:center}
.w-empty{
  border-bottom:1px dashed rgba(245,197,24,.25);min-height:40px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:rgba(245,197,24,.4);font-size:18px;letter-spacing:4px
}
.w-empty:active{background:rgba(245,197,24,.08)}
.w-total-row td{border-top:1.5px solid var(--line);padding-top:12px}
.w-total{
  background:rgba(0,0,0,.4);border:1.5px solid var(--gold);border-radius:10px;
  padding:8px;text-align:center;font-weight:700
}
.w-total b{display:block;color:var(--gold);font-size:20px}
.w-total span{font-size:11px;color:var(--mut)}
.w-deficit{
  margin-top:14px;text-align:center;padding:12px;border-radius:14px;
  border:1.5px solid;font-weight:700
}
.w-deficit b{display:block;font-size:28px;margin-bottom:2px}
.w-deficit span{font-size:12px}
.w-deficit.red{border-color:var(--red);background:rgba(255,138,152,.08);color:var(--red)}
.w-deficit.green{border-color:var(--grn);background:rgba(123,224,164,.08);color:var(--grn)}
.w-deficit.blue{border-color:var(--blu);background:rgba(110,181,255,.08);color:var(--blu)}
.w-hint{font-size:11px;color:var(--mut);text-align:center;margin:8px 0 4px}

/* تفصيل التقرير + تجميع محسّن */
.detail-list{display:flex;flex-direction:column;gap:10px}
.detail-card{
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;animation:fadeSlideIn .3s ease both
}
[data-theme="light"] .detail-card{background:#fafafa;border-color:rgba(0,0,0,.1)}
.detail-card .d-head{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;
  font-weight:700;color:var(--gold);font-size:15px
}
.detail-card .d-rows{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.detail-card .d-item{
  background:rgba(0,0,0,.2);border-radius:10px;padding:8px;text-align:center
}
[data-theme="light"] .detail-card .d-item{background:#f0f0f0}
.detail-card .d-item b{display:block;font-size:20px;color:var(--txt);margin-bottom:2px}
.detail-card .d-item span{font-size:11px;color:var(--mut)}
.detail-card .d-item.ok b{color:var(--grn)}
.detail-card .d-remain{
  margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);
  display:flex;justify-content:space-between;align-items:center;font-size:13px
}
.detail-card .d-remain b{color:var(--red);font-size:18px}
.detail-card .d-remain.zero b{color:var(--grn)}
.tbl2block{
  background:rgba(255,255,255,.04)!important;border:1px solid var(--line)!important;border-radius:16px!important;
  padding:14px!important;margin-bottom:12px!important;animation:fadeSlideIn .28s ease both
}
[data-theme="light"] .tbl2block{background:#fff!important;border-color:rgba(0,0,0,.1)!important;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.tbl-title{text-align:center!important}
.card.anim-in,.item.anim-in,.report-card.anim-in{animation:fadeSlideIn .25s ease both}


/* جدول المشاركة مع المدير */
.share-table-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
.share-table{width:100%;border-collapse:collapse;font-size:13px;min-width:300px}
.share-table th{
  background:rgba(245,197,24,.15);color:var(--gold);font-weight:700;
  padding:12px 8px;text-align:center;border-bottom:1px solid var(--line);font-size:12px
}
[data-theme="light"] .share-table th{background:rgba(184,134,11,.12)}
.share-table td{
  padding:11px 8px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06);color:var(--txt)
}

<script>
(function(){
"use strict";
var TYPES=["محابس","خواتم","دبل"];
var KEY="sn21_cast_state_v1";
var FIREBASE_DB_URL="https://sn975-47268-default-rtdb.europe-west1.firebasedatabase.app";
var syncTimer=0, syncing=false;

function setSyncStatus(txt,cls){
  var st=document.getElementById("syncStatus");
  if(st){
    if(cls==="ok") st.textContent="✓ متصل بالسحابة";
    else if(cls==="err") st.textContent="⚡ يعمل محلياً";
    else st.textContent="⚡ يعمل محلياً";
  }
}
function pushToCloud(){
  if(syncing) return;
  syncing=true;
  setSyncStatus("جارِ الحفظ في السحابة…");
  fetch(FIREBASE_DB_URL+"/state.json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(state)})
    .then(function(r){ if(!r.ok) throw new Error("http "+r.status); setSyncStatus("تمت المزامنة ✓","ok"); })
    .catch(function(){ setSyncStatus("تعذّرت المزامنة (تحقق من الإنترنت)","err"); })
    .then(function(){ syncing=false; });
}
function pullFromCloud(onDone){
  setSyncStatus("جارِ التحقق من السحابة…");
  fetch(FIREBASE_DB_URL+"/state.json")
    .then(function(r){ if(!r.ok) throw new Error("http "+r.status); return r.json(); })
    .then(function(cloud){
      var changed=false;
      if(cloud&&typeof cloud==="object"){
        var cloudTs=cloud._ts||0, localTs=state._ts||0;
        if(cloud && typeof cloud === "object"){
          // دمج ذكي دائماً: أوزان (قيم مختلفة تُجمع، المتشابهة تُبقى الأقدم) + أشجار حسب الرقم
          var before = JSON.stringify({w:state.weight, t:(state.trees||[]).map(function(x){return x.number+":"+(x.updatedAt||0)})});
          state = mergeState(state, cloud);
          var after = JSON.stringify({w:state.weight, t:(state.trees||[]).map(function(x){return x.number+":"+(x.updatedAt||0)})});
          if(before !== after){
            save(false);
            changed=true;
          }
        }
      }
      setSyncStatus("متصل بالسحابة ✓","ok");
      if(onDone) onDone(changed);
    })
    .catch(function(){
      setSyncStatus("بدون اتصال بالسحابة (العمل محليًا)","err");
      if(onDone) onDone(false);
    });
}
function queuePush(){ clearTimeout(syncTimer); syncTimer=setTimeout(pushToCloud,1200); }

// عند عودة الإنترنت: اسحب آخر نسخة من السحابة (ودمجها إن كانت أحدث) ثم ادفع أي تغييرات محلية لم تُحفظ
window.addEventListener("online", function(){
  pullFromCloud(function(changed){ if(changed) renderAll(); pushToCloud(); });
});
window.addEventListener("offline", function(){
  setSyncStatus("غير متصل بالإنترنت (العمل محليًا)","err");
});

var state, selectedCategory="محابس", pending=[], toastTimer=0;
var shownTimes={}; // id -> true when time is revealed

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

/* ===== دمج ذكي للمزامنة بين الأجهزة ===== */
function parseTime(t){
  // يحول "HH:MM:SS" أو "HH:MM" إلى ثواني للمقارنة، أو 0 إذا فاضي
  if(!t || typeof t!=="string") return 0;
  var p=t.split(":").map(Number);
  if(p.length<2 || isNaN(p[0])) return 0;
  return (p[0]*3600) + ((p[1]||0)*60) + (p[2]||0);
}

function mergeWeightList(localArr, cloudArr){
  // دمج قائمتين من الأوزان:
  // - نفس القيمة → نحتفظ بالأقدم فقط
  // - قيم مختلفة → نحتفظ بالاثنين
  // النتيجة مرتبة من الأقدم إلى الأحدث
  var map = {}; // value -> entry (الأقدم)
  function consider(entry){
    if(!entry) return;
    var val = String(entry.value==null?"":entry.value).trim();
    if(val==="") return; // نتجاهل الفاضي
    var key = val;
    if(!map[key]){
      map[key] = entry;
    } else {
      // نفس القيمة → نأخذ الأقدم
      var oldT = parseTime(map[key].time);
      var newT = parseTime(entry.time);
      if(newT > 0 && (oldT===0 || newT < oldT)){
        map[key] = entry;
      }
    }
  }
  (localArr||[]).forEach(consider);
  (cloudArr||[]).forEach(consider);
  var result = Object.keys(map).map(function(k){ return map[k]; });
  // ترتيب حسب الوقت (الأقدم أولاً)
  result.sort(function(a,b){
    return parseTime(a.time) - parseTime(b.time);
  });
  return result;
}

function mergeTrees(localTrees, cloudTrees){
  // دمج الأشجار حسب الرقم:
  // - نفس الرقم → نأخذ الأحدث (حسب updatedAt)
  // - أرقام مختلفة → نحتفظ بالاثنين
  var map = {}; // number -> tree
  function consider(tree){
    if(!tree) return;
    var num = String(tree.number);
    if(!map[num]){
      map[num] = tree;
    } else {
      var oldUp = map[num].updatedAt || 0;
      var newUp = tree.updatedAt || 0;
      if(newUp >= oldUp) map[num] = tree;
    }
  }
  (localTrees||[]).forEach(consider);
  (cloudTrees||[]).forEach(consider);
  var result = Object.keys(map).map(function(k){ return map[k]; });
  // ترتيب حسب رقم الشجرة
  result.sort(function(a,b){ return (a.number||0) - (b.number||0); });
  return result;
}

function mergeState(local, cloud){
  // دمج كامل: أوزان + أشجار بذكاء، وباقي الحقول آخر تعديل يفوز
  var merged = JSON.parse(JSON.stringify(cloud)); // نبدأ من السحابة
  // الأوزان: دمج ذكي
  merged.weight = {
    work: mergeWeightList(local.weight && local.weight.work, cloud.weight && cloud.weight.work),
    incoming: mergeWeightList(local.weight && local.weight.incoming, cloud.weight && cloud.weight.incoming)
  };
  // الأشجار: دمج ذكي حسب الرقم
  merged.trees = mergeTrees(local.trees, cloud.trees);
  // nextTreeNum: الأكبر
  merged.nextTreeNum = Math.max(local.nextTreeNum||1, cloud.nextTreeNum||1);
  // القياسات: ندمجها أيضاً ببساطة (حسب id) أو نأخذ الأحدث
  // حالياً نأخذ من الأحدث (_ts) مع الحفاظ على المحلية إن لم توجد في السحابة
  if(!merged.measurements) merged.measurements = [];
  if(local.measurements && local.measurements.length){
    var mIds = {};
    merged.measurements.forEach(function(m){ mIds[m.id]=true; });
    local.measurements.forEach(function(m){
      if(m && m.id && !mIds[m.id]) merged.measurements.push(m);
    });
  }
  // _ts: الأحدث
  merged._ts = Math.max(local._ts||0, cloud._ts||0);
  return merged;
}

function today(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function nowTime(){
  var d=new Date();
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");
}
function splitDate(iso){
  if(!iso) return {y:"",m:"",d:""};
  var p=iso.split("-");
  return {y:p[0]||"",m:p[1]||"",d:p[2]||""};
}
function joinDate(y,m,d){
  y=String(y||"").replace(/\D/g,"");
  m=String(m||"").replace(/\D/g,"");
  d=String(d||"").replace(/\D/g,"");
  if(!y&&!m&&!d) return "";
  if(m.length===1) m="0"+m;
  if(d.length===1) d="0"+d;
  return y+"-"+m+"-"+d;
}
function n(v){var x=parseFloat(v);return isFinite(x)?x:0}
function disp(v){var x=parseFloat(v);return (isFinite(x)&&x!==0)?String(x):""}
function autoReq(count, loss){var r=n(count)-n(loss);return r>0?r:0}
function emptyFinish(){return {checked:false,count:0,lossLaham:0,lossHazaz:0}}
function emptyItem(){return {id:uid(),type:"محابس",count:0,reqCount:0,normal:emptyFinish(),padded:emptyFinish()}}
function emptyWeightEntry(){return {id:uid(),value:"",time:"",starred:false}}
function emptyState(){return {
  pouring:{active:false,date:""},
  trees:[],
  nextTreeNum:1,
  measurements:[],
  weight:{work:[],incoming:[]},
  readyOverrides:{},
  readyBatches:{},
  _ts:0
}}


/* ===== الوضع الليلي / النهاري ===== */
function initTheme(){

}

/* ===== نسخ احتياطي تلقائي (خفيف ولا يبطئ التطبيق) ===== */
var BACKUP_KEY = "sn21_auto_backup_v1";
var backupTimer = 0;
function doAutoBackup(){
  try{
    var payload = JSON.stringify({
      savedAt: Date.now(),
      pouring: state.pouring,
      trees: state.trees,
      nextTreeNum: state.nextTreeNum,
      measurements: state.measurements,
      weight: state.weight,
      readyOverrides: state.readyOverrides
    });
    localStorage.setItem(BACKUP_KEY, payload);
    var info = document.getElementById("backupInfo");
    if(info){
      var d = new Date();
      info.textContent = "آخر نسخ: " + d.toLocaleTimeString("ar");
    }
  }catch(e){}
}
function startAutoBackup(){
  doAutoBackup();
  clearInterval(backupTimer);
  // كل 5 دقائق فقط — خفيف جداً
  backupTimer = setInterval(doAutoBackup, 5*60*1000);
}

/* ===== التقرير اليومي ===== */
function sumWeightSide(arr){
  var t=0, c=0;
  (arr||[]).forEach(function(e){
    var v=parseFloat(e.value);
    if(isFinite(v) && v!==0){ t+=v; c++; }
  });
  return {total:t, count:c};
}
function renderReport(){
  var grid = document.getElementById("reportGrid");
  var dateEl = document.getElementById("reportDate");
  var recent = document.getElementById("reportRecent");
  var detail = document.getElementById("reportDetail");
  if(!grid) return;

  var work = sumWeightSide(state.weight && state.weight.work);
  var inc  = sumWeightSide(state.weight && state.weight.incoming);
  var diff = inc.total - work.total;
  var treesCount = (state.trees||[]).length;
  var measCount = (state.measurements||[]).length;
  var pourDate = (state.pouring && state.pouring.date) || "—";

  if(dateEl) dateEl.textContent = pourDate !== "—" ? ("صبة " + pourDate) : "لا توجد صبة نشطة";
  var badge = document.getElementById("reportBadge");
  if(badge){
    var now = new Date();
    badge.textContent = now.toLocaleDateString("ar-EG", {weekday:"long", year:"numeric", month:"short", day:"numeric"});
  }

  var diffLabel = diff>0 ? "زيادة" : (diff<0 ? "نقص" : "متعادل");
  var diffCls = diff>0 ? "ok" : (diff<0 ? "err" : "");
  grid.innerHTML =
    '<div class="report-card anim-in"><div class="rc-icon">⬇</div><span class="lbl">إجمالي العمل</span><span class="num">'+work.total.toFixed(2)+'</span><span class="sub">'+work.count+' عملية</span></div>'+
    '<div class="report-card ok anim-in"><div class="rc-icon">⬆</div><span class="lbl">إجمالي الواصل</span><span class="num">'+inc.total.toFixed(2)+'</span><span class="sub">'+inc.count+' عملية</span></div>'+
    '<div class="report-card '+diffCls+' anim-in"><div class="rc-icon">⇄</div><span class="lbl">الفرق</span><span class="num">'+diff.toFixed(2)+'</span><span class="sub">'+diffLabel+'</span></div>'+
    '<div class="report-card warn anim-in"><div class="rc-icon">🌳</div><span class="lbl">الأشجار</span><span class="num">'+treesCount+'</span><span class="sub">'+measCount+' قياس</span></div>';

  // جدول تفصيلي للمشاركة مع المدير
  if(detail){
    var rows = [];
    var totalReq=0, totalLoss=0, totalReady=0;
    for(var ti=0;ti<TYPES.length;ti++){
      var type = TYPES[ti];
      ["normal","padded"].forEach(function(finish){
        var items = collectGroup(type, finish);
        if(!items.length) return;
        var req=0, laham=0, hazaz=0;
        for(var r=0;r<items.length;r++){
          var fin = items[r][finish] || {};
          var piece = n(fin.count);
          if(!piece && n(items[r].reqCount)) piece = n(items[r].reqCount);
          req += piece;
          laham += n(fin.lossLaham);
          if(finish==="padded") hazaz += n(fin.lossHazaz);
        }
        var loss = laham + hazaz;
        var key = groupKey(type, finish);
        var batches = (state.readyBatches && state.readyBatches[key]) || [];
        var ready;
        if(batches.length){
          ready=0; batches.forEach(function(b){ ready+=n(b); });
        } else {
          ready = req - loss;
          if(ready < 0) ready = 0;
        }
        totalReq += req;
        totalLoss += loss;
        totalReady += ready;
        var label = finish==="normal" ? "عادي" : "مبطن";

}

function load(){
  state=emptyState();
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw) return;
    var d=JSON.parse(raw);
    if(d&&typeof d==="object"){
      if(d.pouring) state.pouring=d.pouring;
      if(Array.isArray(d.trees)) state.trees=d.trees;
      if(d.nextTreeNum) state.nextTreeNum=d.nextTreeNum;
      if(Array.isArray(d.measurements)) state.measurements=d.measurements;
      if(d.weight) state.weight=d.weight;
      if(d.readyOverrides) state.readyOverrides=d.readyOverrides;
      if(d.readyBatches) state.readyBatches=d.readyBatches;
      if(d._ts) state._ts=d._ts;
    }
  }catch(e){}
  if(!state.weight) state.weight={work:[],incoming:[]};
  if(!state.readyOverrides) state.readyOverrides={};
  if(!state.readyBatches) state.readyBatches={};
}

  state._ts=Date.now();

    for(var i=0;i<state.trees.length;i++){

    }

  try{localStorage.setItem(KEY,JSON.stringify(state))}

}

/* ===== سحب الشاشة لتغيير الصفحات (مثل المعرض) ===== */
(function(){
  var startX=0, startY=0, startTime=0;
  document.addEventListener("touchstart", function(e){
    if(e.touches.length !== 1) return;
    // تجاهل إذا كان اللمس على input أو button أو textarea
    var t = e.target.tagName;
    if(t==="INPUT" || t==="BUTTON" || t==="TEXTAREA" || t==="SELECT") return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startTime = Date.now();
  }, {passive:true});

  document.addEventListener("touchend", function(e){
    if(!startX || e.changedTouches.length !== 1) return;
    var dx = e.changedTouches[0].clientX - startX;
    var dy = e.changedTouches[0].clientY - startY;
    var dt = Date.now() - startTime;
    startX = 0;
    // يجب أن يكون السحب أفقياً وسريعاً بما فيه الكفاية
    if(Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.7 || dt > 600) return;

    var currentBtn = document.querySelector("#navTabs button.on");
    if(!currentBtn) return;
    var p = parseInt(currentBtn.getAttribute("data-p"), 10);
    // في RTL: السحب لليسار (dx سالب) = الصفحة التالية، السحب لليمين = السابقة
    var nextP = dx < 0 ? p + 1 : p - 1;
    if(nextP < 1 || nextP > 4) return;
    var nextBtn = document.querySelector('#navTabs button[data-p="'+nextP+'"]');
    if(nextBtn) nextBtn.click();
  }, {passive:true});
})();

function treeSummary(tree){
  var parts=[];
  for(var i=0;i<tree.items.length;i++){
    var it=tree.items[i], bits=[];
    if(it.normal.checked) bits.push("عادي "+it.normal.count);
    if(it.padded.checked) bits.push("مبطن "+it.padded.count);
    parts.push(it.type+" ("+it.count+")"+(bits.length?" — "+bits.join(" / "):""));
  }
  return parts.join(" · ")||"لا توجد بيانات بعد";
}

function renderItems(wrap,tree){

        '<div class="grid2" style="margin-top:6px">'+
          '<div class="finishbox"><label><input type="checkbox" class="nchk"'+(it.normal.checked?' checked':'')+'> عادي</label>'+
            '<input type="number" class="ncnt" placeholder="العدد" value="'+disp(it.normal.count)+'"></div>'+
          '<div class="finishbox"><label><input type="checkbox" class="pchk"'+(it.padded.checked?' checked':'')+'> مبطن</label>'+
            '<input type="number" class="pcnt" placeholder="العدد" value="'+disp(it.padded.count)+'"></div>'+
        '</div>'+
        (tree.items.length>1?'<button type="button" class="o danger idel" style="margin-top:8px">حذف السطر</button>':'');
      function recalcReq(){
        it.reqCount = autoReq(it.count, tree.castingLoss);
        var ireq = d.querySelector(".ireq");
        if(ireq) ireq.value = disp(it.reqCount);
        // مزامنة العدد مع التشطيب المحدد
        syncFinishCounts();
      }
      function syncFinishCounts(){
        // إذا عادي محدد فقط → العدد المطلوب ينتقل له
        if(it.normal.checked && !it.padded.checked){
          it.normal.count = it.reqCount || it.count || 0;
          var ncnt = d.querySelector(".ncnt");
          if(ncnt) ncnt.value = disp(it.normal.count);
        }
        // إذا مبطن محدد فقط
        if(it.padded.checked && !it.normal.checked){
          it.padded.count = it.reqCount || it.count || 0;
          var pcnt = d.querySelector(".pcnt");
          if(pcnt) pcnt.value = disp(it.padded.count);
        }
        // إذا الاثنين محددين: لا نغيّر تلقائياً (المستخدم يوزّع)
      }
      d.querySelector(".itype").onchange=function(){
        it.type = this.value;
        tree.updatedAt = Date.now();
        save();
        queuePush();
        toast("تم تحديث النوع: "+it.type);
      };
      d.querySelector(".icnt").oninput=function(){it.count=n(this.value);recalcReq();tree.updatedAt=Date.now();save()};
      d.querySelector(".iloss").oninput=function(){tree.castingLoss=n(this.value);recalcReq();tree.updatedAt=Date.now();save()};
      d.querySelector(".nchk").onchange=function(){
        it.normal.checked=this.checked;
        if(this.checked && !n(it.normal.count)){
          it.normal.count = it.reqCount || it.count || 0;
          var ncnt=d.querySelector(".ncnt");
          if(ncnt) ncnt.value=disp(it.normal.count);
        }
        tree.updatedAt=Date.now();
        save();
        queuePush();
      };
      d.querySelector(".ncnt").oninput=function(){it.normal.count=n(this.value);tree.updatedAt=Date.now();save()};
      d.querySelector(".pchk").onchange=function(){
        it.padded.checked=this.checked;
        if(this.checked && !n(it.padded.count)){
          it.padded.count = it.reqCount || it.count || 0;
          var pcnt=d.querySelector(".pcnt");
          if(pcnt) pcnt.value=disp(it.padded.count);
        }
        tree.updatedAt=Date.now();
        save();
        queuePush();
      };
      d.querySelector(".pcnt").oninput=function(){it.padded.count=n(this.value);tree.updatedAt=Date.now();save()};
      var del=d.querySelector(".idel");
      if(del) del.onclick=function(e){e.preventDefault();tree.items.splice(idx,1);save();renderTrees()};
      wrap.appendChild(d);
    })(tree.items[i],i);
  }
}

function bindConfirm(btn,armedText,normalText,action){

  };

function pickPhoto(tree,mode){
  var input=document.createElement("input");
  input.type="file"; input.accept="image/*";
  if(mode==="camera") input.setAttribute("capture","environment");
  input.onchange=function(){
    var file=input.files&&input.files[0]; if(!file) return;
    var r=new FileReader();
    r.onload=function(){
      var img=new Image();
      img.onload=function(){
        var max=640, sc=Math.min(1,max/Math.max(img.width,img.height));
        var c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(img.width*sc));
        c.height=Math.max(1,Math.round(img.height*sc));
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        tree.photo=c.toDataURL("image/jpeg",0.6);
        save(); renderTrees();
      };
      img.onerror=function(){toast("تعذّر قراءة الصورة")};
      img.src=r.result;
    };
    r.readAsDataURL(file);
  };
  input.click();
}

/* ===== التجميع + تعديل العدد الجاهز ===== */
function collectGroup(type, finish){
  var items=[];
  var trees = state.trees || [];
  for(var a=0;a<trees.length;a++){
    var tree=trees[a];
    if(!tree || !tree.items) continue;
    for(var b=0;b<tree.items.length;b++){
      var it=tree.items[b];
      if(!it) continue;
      if(it.type===type && it[finish] && it[finish].checked) items.push(it);
    }
  }
  return items;
}
function setGroupLoss(items, finish, field, value){
  for(var i=0;i<items.length;i++){
    if(!items[i][finish]) items[i][finish] = {checked:true,count:0,lossLaham:0,lossHazaz:0};
    items[i][finish][field] = (i===0 ? value : 0);
  }
}
function groupKey(type,finish){return type+"_"+finish}
var _tables2Timer=0;
function renderTables2(){
  var el=document.getElementById("tables2");
  if(!el) return;
  el.innerHTML="";
  var any=false;
  for(var ti=0;ti<TYPES.length;ti++){
    var type=TYPES[ti];
    for(var fi=0;fi<2;fi++){
      var finish=fi===0?"normal":"padded";
      var items=collectGroup(type, finish);
      if(!items.length) continue;
      any=true;
      var req=0, laham=0, hazaz=0;
      for(var r=0;r<items.length;r++){
        var fin = items[r][finish] || {};
        // العدد المطلوب من العدد في التشطيب، أو من reqCount كاحتياطي
        var piece = n(fin.count);
        if(!piece && n(items[r].reqCount)) piece = n(items[r].reqCount);
        req += piece;
        laham += n(fin.lossLaham);
        if(finish==="padded") hazaz += n(fin.lossHazaz);
      }
      var calcReady = req - laham - hazaz;
      if(calcReady < 0) calcReady = 0;
      var key=groupKey(type,finish);
      if(!state.readyBatches) state.readyBatches={};
      var batches = state.readyBatches[key];
      // إذا ما في دفعات، نعرض القيمة المحسوبة كدفعة واحدة للعرض
      var showBatches = (batches && batches.length) ? batches.slice() : [calcReady];
      var batchesSum = 0;
      showBatches.forEach(function(b){ batchesSum += n(b); });

      var box=document.createElement("div");
      box.className="tbl2block anim-in";
      var htmlBlock='<div class="tbl-title">'+type+(finish==="normal"?" عادي":" مبطن")+'</div>'+
        '<div class="sumbox"><div class="sumitem"><b>'+(req||"0")+'</b><span>العدد المطلوب</span></div></div>'+
        '<div class="arrow">↓</div>'+
        '<div class="tblwrap"><table><tr><th>العدد</th>'+
        (finish==="padded"?"<th>تلف هزاز</th>":"")+
        '<th>تلف لحام</th></tr><tr>'+
        '<td><b>'+(req||"0")+'</b></td>';
      if(finish==="padded"){
        htmlBlock+='<td><input type="number" class="loss-in g-loss" placeholder="0" value="'+disp(hazaz)+
          '" data-type="'+type+'" data-fin="padded" data-f="lossHazaz"></td>';
      }
      htmlBlock+='<td><input type="number" class="loss-in g-loss" placeholder="0" value="'+disp(laham)+
        '" data-type="'+type+'" data-fin="'+finish+'" data-f="lossLaham"></td>'+
        '</tr></table></div>'+
        '<div class="arrow">↓</div>'+
        '<div class="sumbox"><div class="sumitem ready" data-key="'+key+'" data-calc="'+calcReady+'">'+
          '<b class="ready-val" data-key="'+key+'">'+batchesSum+'</b>'+
          '<span>العدد الجاهز</span></div></div>'+
        '<div class="ready-batches" data-key="'+key+'">';
      for(var bi=0;bi<showBatches.length;bi++){
        htmlBlock+='<input type="number" class="ready-batch-in" data-key="'+key+'" data-idx="'+bi+'" placeholder="دفعة" value="'+disp(showBatches[bi])+'">';
      }
      htmlBlock+='</div><div class="ready-hint">اضغط مطولاً على الجاهز لإضافة دفعة جديدة</div>';
      box.innerHTML=htmlBlock;
      el.appendChild(box);
    }
  }
  if(!any){
    el.innerHTML='<p class="mut">لا توجد بيانات — أضف أشجاراً وحدد التشطيب في صفحة العمل.</p>';
    return;
  }
  // تحديث التوالف بدون إعادة رسم كاملة (يمنع التعليق)
  var inputs=el.querySelectorAll(".g-loss");
  for(var i=0;i<inputs.length;i++){
    inputs[i].oninput=function(){
      var type=this.getAttribute("data-type");
      var finish=this.getAttribute("data-fin");
      var field=this.getAttribute("data-f");
      var items=collectGroup(type, finish);
      setGroupLoss(items, finish, field, n(this.value));
      // احسب الجاهز فوراً في الواجهة
      var req=0, laham=0, hazaz=0;
      for(var r=0;r<items.length;r++){
        var fin=items[r][finish]||{};
        var piece=n(fin.count);
        if(!piece && n(items[r].reqCount)) piece=n(items[r].reqCount);
        req += piece;
        laham += n(fin.lossLaham);
        if(finish==="padded") hazaz += n(fin.lossHazaz);
      }
      var calcReady=req-laham-hazaz;
      if(calcReady<0) calcReady=0;
      var key=groupKey(type,finish);
      var readyEl=el.querySelector('.ready-val[data-key="'+key+'"]');
      if(readyEl) readyEl.textContent=String(calcReady);
      if(state.readyOverrides) delete state.readyOverrides[key];
      save(false);
      clearTimeout(_tables2Timer);
      _tables2Timer=setTimeout(function(){ queuePush(); }, 500);
    };
  }

  // دفعات الجاهز — تعديل
  var batchIns = el.querySelectorAll(".ready-batch-in");
  for(var bi=0; bi<batchIns.length; bi++){
    batchIns[bi].oninput = function(){
      var key = this.getAttribute("data-key");
      var idx = parseInt(this.getAttribute("data-idx"), 10);
      if(!state.readyBatches) state.readyBatches = {};
      if(!state.readyBatches[key]) state.readyBatches[key] = [];
      state.readyBatches[key][idx] = n(this.value);
      // حدّث المجموع الظاهر
      var sum = 0;
      state.readyBatches[key].forEach(function(v){ sum += n(v); });
      var readyEl = el.querySelector('.ready-val[data-key="'+key+'"]');
      if(readyEl) readyEl.textContent = String(sum);
      save(false);
      clearTimeout(_tables2Timer);
      _tables2Timer=setTimeout(function(){ queuePush(); }, 500);
    };
  }

  // ضغط مطول على خانة الجاهز → اهتزاز + دفعة جديدة
  var readyBoxes = el.querySelectorAll(".sumitem.ready");
  for(var rb=0; rb<readyBoxes.length; rb++){
    (function(box){
      var timer=null;
      function addBatch(){
        var key = box.getAttribute("data-key");
        if(!key) return;
        box.classList.remove("shake");
        void box.offsetWidth;
        box.classList.add("shake");
        if(navigator.vibrate) try{ navigator.vibrate(40); }catch(e){}
        if(!state.readyBatches) state.readyBatches = {};
        if(!state.readyBatches[key] || !state.readyBatches[key].length){
          var calc = n(box.getAttribute("data-calc"));
          state.readyBatches[key] = [calc];
        }
        state.readyBatches[key].push(0);
        save();
        renderTables2();
        toast("تمت إضافة دفعة جاهز جديدة");
      }
      box.addEventListener("touchstart", function(e){
        timer=setTimeout(addBatch, 550);
      }, {passive:true});
      box.addEventListener("touchend", function(){ clearTimeout(timer); });
      box.addEventListener("touchmove", function(){ clearTimeout(timer); });
      box.addEventListener("mousedown", function(){ timer=setTimeout(addBatch, 550); });
      box.addEventListener("mouseup", function(){ clearTimeout(timer); });
      box.addEventListener("mouseleave", function(){ clearTimeout(timer); });
    })(readyBoxes[rb]);
  }
}

/* ===== صفحة الوزن ===== */
function sumWeights(arr){
  var s=0;
  for(var i=0;i<arr.length;i++) s += n(arr[i].value);
  // avoid floating point issues
  return Math.round(s*1000)/1000;
}
function renderWeight(){
  var el=document.getElementById("weightPage");
  if(!el) return;
  if(!state.weight) state.weight={work:[],incoming:[]};
  var work=state.weight.work||[];

  var inc=state.weight.incoming||[];
  // always show at least 12 lines, and keep 2 empty lines available
  var baseRows=Math.max(work.length,inc.length,10);
  var maxRows=baseRows+2;

  var html='<table class="w-table"><thead><tr>';
  html+='<th class="col-val">العمل</th><th class="col-time">الوقت</th>';
  html+='<th class="col-val2">الواصل</th><th class="col-time2">الوقت</th>';
  html+='</tr></thead><tbody>';

  for(var i=0;i<maxRows;i++){
    var w=work[i], inn=inc[i];
    html+='<tr>';
    // العمل
    html+='<td class="col-val">';
    if(w){
      html+='<div class="w-row" data-side="work" data-id="'+w.id+'">';
      html+='<span class="w-star">'+(w.starred?'★':'')+'</span>';
      html+='<input type="number" class="w-input'+(w.starred?' starred':'')+'" value="'+(w.value!==""&&w.value!=null?w.value:"")+'" data-side="work" data-id="'+w.id+'" step="any" inputmode="decimal">';
      html+='</div>';
    } else {
      html+='<div class="w-empty" data-side="work">· · ·</div>';
    }
    html+='</td>';
    // وقت العمل
    html+='<td class="col-time">';
    if(w && w.time && String(w.value||"").trim()!==""){
      html+='<div class="w-time'+(shownTimes[w.id]?' show':'')+'" data-id="'+w.id+'">'+(shownTimes[w.id]?w.time:'···')+'</div>';
    } else {
      html+='<div class="w-time" style="opacity:0.2"> </div>';
    }
    html+='</td>';
    // الواصل
    html+='<td class="col-val2">';
    if(inn){
      html+='<div class="w-row" data-side="incoming" data-id="'+inn.id+'">';
      html+='<span class="w-star">'+(inn.starred?'★':'')+'</span>';
      html+='<input type="number" class="w-input'+(inn.starred?' starred':'')+'" value="'+(inn.value!==""&&inn.value!=null?inn.value:"")+'" data-side="incoming" data-id="'+inn.id+'" step="any" inputmode="decimal">';
      html+='</div>';
    } else {
      html+='<div class="w-empty" data-side="incoming">· · ·</div>';
    }
    html+='</td>';
    // وقت الواصل
    html+='<td class="col-time2">';
    if(inn && inn.time && String(inn.value||"").trim()!==""){
      html+='<div class="w-time'+(shownTimes[inn.id]?' show':'')+'" data-id="'+inn.id+'">'+(shownTimes[inn.id]?inn.time:'···')+'</div>';
    } else {
      html+='<div class="w-time" style="opacity:0.2"> </div>';
    }
    html+='</td>';
    html+='</tr>';
  }
  html+='</tbody></table>';

  // الإجمالي في أسفل الصفحة
  var totalWork=sumWeights(work);
  var totalInc=sumWeights(inc);
  var deficit=Math.round((totalWork-totalInc)*1000)/1000;
  var defClass="red";
  if(deficit<0) defClass="green";
  else if(deficit===0) defClass="blue";

  html+='<div style="display:flex;gap:10px;margin-top:16px;justify-content:center">';
  html+='<div class="w-total" style="flex:1;max-width:140px;padding:6px 8px"><b style="font-size:18px">'+totalWork+'</b><span>الإجمالي</span></div>';
  html+='<div class="w-total" style="flex:1;max-width:140px;padding:6px 8px"><b style="font-size:18px">'+totalInc+'</b><span>الإجمالي</span></div>';
  html+='</div>';

  html+='<div class="w-deficit '+defClass+'" style="margin-top:10px;padding:10px"><b style="font-size:26px">'+Math.abs(deficit)+'</b></div>';

  // زر حذف جميع الأوزان
  html+='<div style="margin-top:20px;padding:0 8px 12px"><button type="button" class="danger" id="btnDelWeight" style="width:100%;padding:12px;font-size:15px">حذف جميع الأوزان</button></div>';

  el.innerHTML=html;

  // events
  // empty line click → add (بدون وقت حتى يُكتب رقم)
  var empties=el.querySelectorAll(".w-empty");
  for(var e=0;e<empties.length;e++){
    empties[e].onclick=function(){
      var side=this.getAttribute("data-side");
      var entry=emptyWeightEntry(); // value:"", time:""
      if(side==="work") state.weight.work.push(entry);
      else state.weight.incoming.push(entry);
      save(false);
      renderWeight();
      setTimeout(function(){
        var inp=document.querySelector('.w-input[data-id="'+entry.id+'"]');
        if(inp){inp.focus();}
      },30);
    };
  }

  function findEntry(side, id){
    var arr=side==="work"?state.weight.work:state.weight.incoming;
    for(var k=0;k<arr.length;k++) if(arr[k].id===id) return {arr:arr, index:k, entry:arr[k]};
    return null;
  }

  function refreshTotalsOnly(){
    var work=state.weight.work||[];
    var inc=state.weight.incoming||[];
    var totalWork=sumWeights(work);
    var totalInc=sumWeights(inc);
    var deficit=Math.round((totalWork-totalInc)*1000)/1000;
    var totals=el.querySelectorAll(".w-total b");
    if(totals[0]) totals[0].textContent=String(totalWork);
    if(totals[1]) totals[1].textContent=String(totalInc);
    var def=el.querySelector(".w-deficit b");
    if(def) def.textContent=String(Math.abs(deficit));
    var box=el.querySelector(".w-deficit");
    if(box){
      box.classList.remove("red","green","blue");
      box.classList.add(deficit<0?"green":(deficit===0?"blue":"red"));
    }
  }

  function removeEntry(side, id){
    var found=findEntry(side, id);
    if(!found) return;
    found.arr.splice(found.index, 1);
    if(shownTimes[id]) delete shownTimes[id];
  }

  var inputs=el.querySelectorAll(".w-input");
  for(var i=0;i<inputs.length;i++){
    // أثناء الكتابة: حدّث القيمة فقط بدون إعادة رسم (يحافظ على التركيز)
    inputs[i].addEventListener("input", function(){
      var side=this.getAttribute("data-side");
      var id=this.getAttribute("data-id");
      var found=findEntry(side, id);
      if(!found) return;
      var val=this.value.trim();
      found.entry.value = val;
      // إذا انمسحت القيمة بالكامل → احذف السطر والوقت فوراً من البيانات
      if(val===""){
        removeEntry(side, id);
        save(false);
        // إعادة رسم مؤجلة بعد ما يطلع المستخدم من الخانة أفضل؛ هنا نحدّث الوقت في الواجهة
        var row=this.closest("tr");
        if(row){
          var timeCell=side==="work"?row.querySelector(".col-time .w-time"):row.querySelector(".col-time2 .w-time");
          if(timeCell){ timeCell.textContent=""; timeCell.className="w-time"; timeCell.style.opacity="0.2"; timeCell.removeAttribute("data-id"); }
        }
        refreshTotalsOnly();
        return;
      }
      // أول رقم → سجّل الوقت إن لم يكن موجود
      if(!found.entry.time){
        found.entry.time=nowTime();
        var row=this.closest("tr");
        if(row){
          var timeCell=side==="work"?row.querySelector(".col-time .w-time"):row.querySelector(".col-time2 .w-time");
          if(timeCell){
            timeCell.setAttribute("data-id", id);
            timeCell.textContent = shownTimes[id]?found.entry.time:"···";
            timeCell.className = "w-time"+(shownTimes[id]?" show":"");
            timeCell.style.opacity = "";
          }
        }
      }
      refreshTotalsOnly();
      save(false);
    });

    // عند الخروج من الخانة: نظّف السطور الفارغة وأعد الرسم مرة واحدة
    inputs[i].addEventListener("blur", function(){
      var side=this.getAttribute("data-side");
      var id=this.getAttribute("data-id");
      var found=findEntry(side, id);
      var val=this.value.trim();
      if(!found || val===""){
        removeEntry(side, id);
        // نظّف أي قيود فاضية أخرى
        ["work","incoming"].forEach(function(s){
          state.weight[s]=(state.weight[s]||[]).filter(function(x){ return x && String(x.value).trim()!==""; });
        });
        save();
        renderWeight();
        return;
      }
      found.entry.value=val;
      if(!found.entry.time) found.entry.time=nowTime();
      save();
      queuePush();
    });

    // long press for star
    (function(inp){
      var timer=null;
      function toggleStar(){
        var side=inp.getAttribute("data-side");
        var id=inp.getAttribute("data-id");
        var found=findEntry(side, id);
        if(!found) return;
        found.entry.starred=!found.entry.starred;
        save();
        renderWeight();
        toast(found.entry.starred?"تمت إضافة نجمة ★":"تمت إزالة النجمة");
      }
      inp.addEventListener("touchstart",function(){ timer=setTimeout(toggleStar,550); },{passive:true});
      inp.addEventListener("touchend",function(){clearTimeout(timer);});
      inp.addEventListener("touchmove",function(){clearTimeout(timer);});
      inp.addEventListener("mousedown",function(){ timer=setTimeout(toggleStar,550); });
      inp.addEventListener("mouseup",function(){clearTimeout(timer);});
      inp.addEventListener("mouseleave",function(){clearTimeout(timer);});
    })(inputs[i]);
  }

  // time reveal
  var times=el.querySelectorAll(".w-time[data-id]");
  for(var t=0;t<times.length;t++){
    times[t].onclick=function(){
      var id=this.getAttribute("data-id");
      shownTimes[id]=!shownTimes[id];
      renderWeight();
    };
  }

  // زر حذف جميع الأوزان مع تأكيد
  var delW = document.getElementById("btnDelWeight");
  if(delW){
    bindConfirm(delW, "اضغط مرة أخرى للتأكيد", "حذف جميع الأوزان", function(){
      state.weight = {work:[], incoming:[]};
      shownTimes = {};
      save();
      renderWeight();
      toast("تم حذف جميع الأوزان");
      queuePush();
    });
  }
}

      d.className="item anim-in";
      var sizes=["كبير","وسط","صغير"], so="", mo="", opts=measureOptions();
      for(var a=0;a<sizes.length;a++) so+='<option'+(p.size===sizes[a]?' selected':'')+'>'+sizes[a]+'</option>';
      for(var b=0;b<opts.length;b++) mo+='<option'+(p.measure===opts[b]?' selected':'')+'>'+opts[b]+'</option>';
      d.innerHTML=
        '<div class="grid3">'+
          '<div><label class="l">النوع</label><input class="pt" value="'+(p.freeText||"")+'"></div>'+
          '<div><label class="l">الحجم</label><select class="ps">'+so+'</select></div>'+
          '<div><label class="l">القياس</label><select class="pm">'+mo+'</select></div>'+
        '</div>'+
        '<div class="row" style="margin-top:6px">'+
          '<button type="button" class="g psv">حفظ</button>'+
          '<button type="button" class="o danger prm">حذف</button></div>';
      d.querySelector(".pt").oninput=function(){p.freeText=this.value};
      d.querySelector(".ps").onchange=function(){p.size=this.value};
      d.querySelector(".pm").onchange=function(){p.measure=this.value};
      d.querySelector(".psv").onclick=function(e){
        e.preventDefault();
        state.measurements.push({id:uid(),category:p.category,freeText:p.freeText,size:p.size,measure:p.measure});
        pending=pending.filter(function(x){return x.id!==p.id});
        save(); renderPendingAndList();
      };
      d.querySelector(".prm").onclick=function(e){
        e.preventDefault();
        pending=pending.filter(function(x){return x.id!==p.id});
        renderPendingAndList();
      };
      wrap.appendChild(d);
    })(pending[i]);
  }
  var list=document.getElementById("measureList");
  list.innerHTML="";
  var items=[], hasPending=false;
  for(var m=0;m<state.measurements.length;m++) if(state.measurements[m].category===selectedCategory) items.push(state.measurements[m]);
  for(var p=0;p<pending.length;p++) if(pending[p].category===selectedCategory) hasPending=true;
  if(!items.length&&!hasPending) list.innerHTML='<p class="mut">لا توجد قياسات بعد لهذا النوع</p>';
  for(var x=0;x<items.length;x++){
    var line=document.createElement("div");
    line.className="measline";
    line.innerHTML='<span>'+items[x].category+(items[x].freeText?" "+items[x].freeText:"")+" "+items[x].size+
      '</span><span class="val">'+items[x].measure+'</span>';
    list.appendChild(line);
  }
}

function renderPage1(){ renderPourControls(); renderTrees(); renderActions(); }
function renderAll(){ renderPage1(); renderTables2(); renderWeight(); renderPage3(); if(document.getElementById("p5")&&document.getElementById("p5").classList.contains("active")) renderReport(); }

load();
renderAll();
initTheme();
startAutoBackup();

// أزرار صفحة التقرير
document.addEventListener("click", function(e){
  var t = e.target;
  if(!t || !t.id) return;
  if(t.id==="btnExportTable"){ e.preventDefault(); exportTableOnly(); }
  if(t.id==="btnExportExcel"){ e.preventDefault(); exportExcel(); }
  if(t.id==="btnExportJson"){ e.preventDefault(); exportData(); }
  if(t.id==="btnBackupNow"){ e.preventDefault(); doAutoBackup(); toast("تم النسخ الاحتياطي ✓"); }
});

if(navigator.onLine){
  pullFromCloud(function(changed){ if(changed) renderAll(); });
}else{
  setSyncStatus("غير متصل بالإنترنت (العمل محليًا)","err");
}
})();
