<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070605">
<title>SN 975</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='40' r='18' fill='none' stroke='%23d4af37' stroke-width='5'/%3E%3Cpolygon points='32,6 42,20 32,28 22,20' fill='%23c45c4a' stroke='%23d4af37' stroke-width='2'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070605'/%3E%3Ccircle cx='32' cy='42' r='16' fill='none' stroke='%23d4af37' stroke-width='5'/%3E%3Cpolygon points='32,10 41,22 32,29 23,22' fill='%23c45c4a' stroke='%23d4af37' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#070605; --panel:#14110c; --cream:#f4ead2;
  --gold:#d4af37; --muted:#b59a62; --garnet:#c45c4a; --good:#3dba6e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--ink);color:var(--cream);
  font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-weight:600;
  padding:0 12px 28px;overflow-x:hidden;
}
button,input,select{font:inherit}
.header{text-align:center;padding:12px 0 4px}
.title{font-size:28px;font-weight:800;color:var(--gold);letter-spacing:2px}
.kicker{font-size:11px;color:var(--muted);letter-spacing:2px}
.rule{height:1px;background:rgba(212,175,55,.28);margin:8px auto 0;max-width:380px}

/* تبويبات أعلى الصفحة */
.tabs{
  position:sticky;top:0;z-index:50;
  display:grid;grid-template-columns:1fr 1fr 1fr;
  background:var(--ink);
  border-bottom:1.5px solid rgba(212,175,55,.35);
  margin:0 -12px 12px;
}
.tab{
  padding:12px 4px;text-align:center;color:var(--muted);
  font-size:14px;font-weight:700;cursor:pointer;border:0;background:transparent;
  min-height:46px;touch-action:manipulation;
  border-bottom:2px solid transparent;
}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.page{display:none;max-width:480px;margin:0 auto}
.page.active{display:block}

.btn{
  background:var(--panel);color:var(--gold);border:1.5px solid rgba(212,175,55,.4);
  border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700;
  cursor:pointer;min-height:44px;touch-action:manipulation;margin:4px 4px 4px 0;
}
.btn:active{opacity:.85}
.btn.primary{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.btn.danger{border-color:var(--garnet);color:var(--garnet)}
.btn.small{padding:8px 10px;font-size:13px;min-height:40px}
.btn.block{width:100%;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
label.f{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
input,select{
  background:var(--ink);color:var(--cream);border:1.5px solid rgba(212,175,55,.32);
  border-radius:12px;padding:10px 11px;font-size:15px;font-weight:600;
  width:100%;min-height:44px;outline:none;
}
input:focus,select:focus{border-color:var(--gold)}
input[type="number"],input[type="date"]{direction:ltr;text-align:center}
input[type="checkbox"]{width:18px;height:18px;accent-color:var(--gold)}
.card{
  background:var(--panel);border:1.5px solid rgba(212,175,55,.32);
  border-radius:16px;padding:12px 14px;margin:10px 0;
}
.card h3{margin:0 0 4px;color:var(--gold);font-size:20px;font-weight:800}
.cardSummary{font-size:13px;color:#ddd;margin-top:2px;line-height:1.55}
.item{border:1.5px solid rgba(212,175,55,.28);border-radius:12px;padding:8px;margin:8px 0;background:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
@media (max-width:400px){.grid3{grid-template-columns:1fr 1fr}}
.finishbox{border:1.5px solid rgba(212,175,55,.28);border-radius:10px;padding:6px}
.finishbox label{display:flex;align-items:center;gap:6px;font-size:13px;min-height:32px}
.reqbox{
  border:2px solid var(--gold);border-radius:14px;background:rgba(212,175,55,.08);
  padding:8px 14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;
}
.reqbox label.f{margin:0;color:var(--gold);font-size:13px;font-weight:800}
.reqbox input{
  width:96px;font-size:22px;font-weight:800;text-align:center;
  border-color:var(--gold);min-height:40px;padding:4px 6px;
}
.logo{display:flex;justify-content:center;margin-bottom:2px}
.logo svg{width:54px;height:54px}
.syncbar{display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-size:12px;color:var(--muted);margin:-4px 0 10px;padding:6px 10px;
  border:1px solid rgba(212,175,55,.2);border-radius:10px}
.syncbar.ok{color:#8fcf8f}
.syncbar.err{color:#e08a8a}
.syncbar.pending{color:var(--gold)}
.syncbar .btn.small{padding:4px 10px;font-size:12px}
.daterow{display:flex;align-items:center;gap:4px;direction:ltr}
.daterow .dpart{width:auto;flex:1;min-width:0;text-align:center;padding:10px 4px}
.daterow .dsep{color:var(--gold);font-weight:800;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid rgba(212,175,55,.28);padding:10px 6px;text-align:center}
th{background:var(--ink);color:var(--gold)}
.tblwrap{overflow-x:auto}
.tbl2block{margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid rgba(212,175,55,.2)}
.tbl-title{color:var(--gold);font-weight:800;margin:0 0 8px;font-size:17px;text-align:right}
.sumbox{display:flex;justify-content:center;margin:6px 0;gap:6px;flex-wrap:wrap}
.sumitem{
  background:var(--ink);border:1.5px solid var(--gold);border-radius:12px;
  padding:8px 16px;text-align:center;min-width:90px;
}
.sumitem b{display:block;color:var(--gold);font-size:22px}
.sumitem span{font-size:11px;color:var(--muted)}
.sumitem.ready{border-color:var(--good)}
.sumitem.ready b{color:var(--good)}
.arrow{text-align:center;color:var(--gold);margin:4px 0;font-size:16px}
.loss-in{
  width:76px;min-height:40px;text-align:center;direction:ltr;
  background:var(--ink);color:var(--cream);border:1.5px solid rgba(212,175,55,.45);
  border-radius:10px;padding:6px 8px;font-size:15px;font-weight:700;
}
.measline{
  background:var(--ink);border:1.5px solid rgba(212,175,55,.28);
  border-radius:12px;padding:10px 12px;margin:6px 0;font-size:13px;
  display:flex;justify-content:space-between;align-items:center;
}
.measline .val{color:var(--gold);font-size:20px;font-weight:800}
.muted{color:var(--muted);font-size:13px;text-align:center;margin:14px 0}
.segrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}
.segbtn{
  padding:10px;text-align:center;border:1.5px solid rgba(212,175,55,.32);
  border-radius:12px;color:var(--cream);font-weight:700;cursor:pointer;
  font-size:13px;background:var(--panel);min-height:42px;touch-action:manipulation;
}
.segbtn.active{background:var(--gold);color:var(--ink)}
.photothumb{width:40px;height:40px;object-fit:cover;border-radius:8px;border:1.5px solid var(--gold)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.actions .span2{grid-column:1/-1}
#toast{
  position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);
  background:var(--panel);color:var(--cream);padding:10px 16px;border-radius:12px;
  border:1.5px solid var(--gold);z-index:200;font-size:13px;max-width:90%;
  text-align:center;display:none;
}
.hero{text-align:center;padding:22px 14px}
.hero h2{color:var(--gold);font-size:24px;margin:0 0 6px}
.hero p{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 14px}
</style>
</head>
<body>
<div class="header">
  <div class="logo"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <circle cx="32" cy="40" r="18" fill="none" stroke="#d4af37" stroke-width="5"/>
    <polygon points="32,6 42,20 32,28 22,20" fill="#c45c4a" stroke="#d4af37" stroke-width="2"/>
  </svg></div>
  <div class="kicker">دفتر الصب</div>
  <div class="title">SN 975</div>
  <div class="rule"></div>
</div>
<div class="syncbar" id="syncBar">
  <span id="syncStatus">وضع أوفلاين (حفظ محلي)</span>
  <button type="button" id="btnSyncNow" class="btn small">مزامنة الآن</button>
</div>

<div class="tabs" id="navTabs">
  <button type="button" class="tab active" data-p="1">العمل</button>
  <button type="button" class="tab" data-p="2">التجميع</button>
  <button type="button" class="tab" data-p="3">القياسات</button>
</div>

<div class="page active" id="p1">
  <div id="pourControls"></div>
  <div id="treesList"></div>
  <div class="actions" id="page1Actions"></div>
</div>
<div class="page" id="p2"><div id="tables2"></div></div>
<div class="page" id="p3">
  <button type="button" class="btn primary block" id="btnAddMeasure">+ إضافة قياس جديد</button>
  <div class="segrow" id="cat3"></div>
  <div id="entries3"></div>
  <div id="measureList" style="margin-top:10px"></div>
</div>
<div id="toast"></div>

<script>
(function(){
"use strict";
var TYPES=["محابس","خواتم","دبل"];
var KEY="sn975_state_v2";
var PENDING_KEY="sn975_dirty_v1";
var FIREBASE_DB_URL="https://sn975-47268-default-rtdb.europe-west1.firebasedatabase.app";
var syncTimer=0, retryTimer=0, syncing=false, hasDirty=false;
var state, selectedCategory="محابس", pending=[], toastTimer=0;

function setSyncStatus(txt,cls){
  var bar=document.getElementById("syncBar"), s=document.getElementById("syncStatus");
  if(!bar||!s) return;
  s.textContent=txt;
  bar.className="syncbar"+(cls?(" "+cls):"");
}

function markDirty(val){
  hasDirty=!!val;
  try{
    if(hasDirty) localStorage.setItem(PENDING_KEY,"1");
    else localStorage.removeItem(PENDING_KEY);
  }catch(e){}
}

function loadDirtyFlag(){
  try{ hasDirty = localStorage.getItem(PENDING_KEY)==="1"; }
  catch(e){ hasDirty=false; }
}

function fetchWithTimeout(url, opts, ms){
  opts = opts || {};
  ms = ms || 5000;
  if(typeof AbortController === "undefined") return fetch(url, opts);
  var ctrl = new AbortController();
  var timer = setTimeout(function(){ ctrl.abort(); }, ms);
  opts.signal = ctrl.signal;
  return fetch(url, opts).finally(function(){ clearTimeout(timer); });
}

function scheduleRetry(){
  clearTimeout(retryTimer);
  if(!hasDirty) return;
  retryTimer=setTimeout(function(){
    if(navigator.onLine && hasDirty) pushToCloud(false);
  }, 15000);
}

function pushToCloud(showToastOnOk){
  if(!navigator.onLine){
    setSyncStatus("بدون إنترنت — محفوظ محليًا وسيُزامَن تلقائيًا","pending");
    scheduleRetry();
    return;
  }
  if(syncing) return;
  syncing=true;
  setSyncStatus("جارِ مزامنة التعديلات…","pending");
  fetchWithTimeout(
    FIREBASE_DB_URL+"/state.json",
    {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(state)},
    5000
  )
    .then(function(r){
      if(!r.ok) throw new Error("http "+r.status);
      markDirty(false);
      setSyncStatus("متزامن مع السحابة ✓","ok");
      if(showToastOnOk) toast("تمت المزامنة مع السحابة ✓");
    })
    .catch(function(){
      setSyncStatus("محفوظ محليًا (بانتظار توفر الشبكة)","pending");
      scheduleRetry();
    })
    .then(function(){ syncing=false; });
}

function pullFromCloud(onDone){
  if(!navigator.onLine){
    setSyncStatus(hasDirty ? "بدون إنترنت — توجد تعديلات بانتظار الرفع" : "وضع أوفلاين — البيانات محفوظة محليًا","pending");
    if(onDone) onDone(false);
    return;
  }
  setSyncStatus("جارِ التحقق من السحابة…","pending");
  fetchWithTimeout(FIREBASE_DB_URL+"/state.json", {}, 5000)
    .then(function(r){ if(!r.ok) throw new Error("http "+r.status); return r.json(); })
    .then(function(cloud){
      var changed=false;
      if(cloud&&typeof cloud==="object"){
        var cloudTs=cloud._ts||0, localTs=state._ts||0;
        if(cloudTs>localTs && !hasDirty){
          state=cloud;
          save(false, false);
          changed=true;
        }
      }
      if(hasDirty){
        pushToCloud(false);
      } else {
        setSyncStatus("متصل ومتزامن ✓","ok");
      }
      if(onDone) onDone(changed);
    })
    .catch(function(){
      setSyncStatus(hasDirty ? "محفوظ محليًا — سيُرفع عند توفر الشبكة" : "وضع أوفلاين (حفظ محلي)","pending");
      if(onDone) onDone(false);
    });
}

function queuePush(){
  clearTimeout(syncTimer);
  if(!navigator.onLine){
    setSyncStatus("بدون إنترنت — محفوظ محليًا وسيُزامَن عند الاتصال","pending");
    scheduleRetry();
    return;
  }
  syncTimer=setTimeout(function(){ pushToCloud(false); }, 1000);
}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function splitDate(iso){
  if(!iso) return {y:"",m:"",d:""};
  var p=iso.split("-");
  return {y:p[0]||"",m:p[1]||"",d:p[2]||""};
}
function joinDate(y,m,d){
  y=String(y||"").replace(/\D/g,"");
  m=String(m||"").replace(/\D/g,"");
  d=String(d||"").replace(/\D/g,"");
  if(!y&&!m&&!d) return "";
  if(m.length===1) m="0"+m;
  if(d.length===1) d="0"+d;
  return y+"-"+m+"-"+d;
}
function n(v){var x=parseFloat(v);return isFinite(x)?x:0}
function emptyFinish(){return {checked:false,count:0,lossLaham:0,lossHazaz:0}}
function emptyItem(){return {id:uid(),type:"محابس",count:0,reqCount:0,normal:emptyFinish(),padded:emptyFinish()}}
function emptyState(){return {pouring:{active:false,date:""},trees:[],nextTreeNum:1,measurements:[],_ts:0}}

function load(){
  state=emptyState();
  loadDirtyFlag();
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw) return;
    var d=JSON.parse(raw);
    if(d&&typeof d==="object"){
      if(d.pouring) state.pouring=d.pouring;
      if(Array.isArray(d.trees)) state.trees=d.trees;
      if(d.nextTreeNum) state.nextTreeNum=d.nextTreeNum;
      if(Array.isArray(d.measurements)) state.measurements=d.measurements;
      if(d._ts) state._ts=d._ts;
    }
  }catch(e){}
}

function save(push, markAsDirty){
  state._ts=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(state))}
  catch(e){toast("تعذّر الحفظ المحلي")}
  if(markAsDirty!==false && push!==false) markDirty(true);
  if(push!==false) queuePush();
}

function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg;t.style.display="block";
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.style.display="none"},2200);
}

document.getElementById("navTabs").addEventListener("click",function(e){
  var btn=e.target.closest(".tab"); if(!btn) return;
  e.preventDefault();
  var tabs=document.querySelectorAll(".tab"), pages=document.querySelectorAll(".page");
  for(var i=0;i<tabs.length;i++) tabs[i].classList.remove("active");
  for(var j=0;j<pages.length;j++) pages[j].classList.remove("active");
  btn.classList.add("active");
  document.getElementById("p"+btn.getAttribute("data-p")).classList.add("active");
  if(btn.getAttribute("data-p")==="2") renderTables2();
  if(btn.getAttribute("data-p")==="3") renderPage3();
});

function treeSummary(tree){
  var parts=[];
  for(var i=0;i<tree.items.length;i++){
    var it=tree.items[i], bits=[];
    if(it.normal.checked) bits.push("عادي "+it.normal.count);
    if(it.padded.checked) bits.push("مبطن "+it.padded.count);
    parts.push(it.type+" ("+it.count+")"+(bits.length?" — "+bits.join(" / "):""));
  }
  return parts.join(" · ")||"لا توجد بيانات بعد";
}

function renderPourControls(){
  var el=document.getElementById("pourControls");
  if(!state.pouring.active){
    el.innerHTML=
      '<div class="card hero">'+
        '<h2>صبة جديدة</h2>'+
        '<p>ابدأ الصبة، ثم سجّل كل شجرة بعددها وتشطيبها.</p>'+
        '<button type="button" class="btn primary block" id="btnStartPour">بدء صبة</button>'+
      '</div>';
    document.getElementById("btnStartPour").onclick=function(e){
      e.preventDefault();
      state.pouring.active=true; state.pouring.date=today();
      save(); renderPage1();
    };
    return;
  }
  var dparts=splitDate(state.pouring.date);
  el.innerHTML=
    '<div class="row">'+
      '<div style="flex:1"><label class="f">تاريخ الصبة</label>'+
        '<div class="daterow">'+
          '<input type="number" id="pdDay" class="dpart" placeholder="يوم" min="1" max="31" value="'+dparts.d+'">'+
          '<span class="dsep">/</span>'+
          '<input type="number" id="pdMonth" class="dpart" placeholder="شهر" min="1" max="12" value="'+dparts.m+'">'+
          '<span class="dsep">/</span>'+
          '<input type="number" id="pdYear" class="dpart" placeholder="سنة" min="2000" max="2100" value="'+dparts.y+'">'+
        '</div></div>'+
      '<button type="button" class="btn primary" id="btnAddTree" style="margin-top:16px">+ إضافة شجرة</button>'+
    '</div>';
  function onDatePartChange(){
    state.pouring.date=joinDate(
      document.getElementById("pdYear").value,
      document.getElementById("pdMonth").value,
      document.getElementById("pdDay").value
    );
    save();
  }
  document.getElementById("pdDay").onchange=onDatePartChange;
  document.getElementById("pdMonth").onchange=onDatePartChange;
  document.getElementById("pdYear").onchange=onDatePartChange;
  document.getElementById("btnAddTree").onclick=function(e){
    e.preventDefault();
    state.trees.push({id:uid(),number:state.nextTreeNum++,castingLoss:0,photo:null,collapsed:false,items:[emptyItem()]});
    save(); renderTrees(); renderActions();
  };
}

function renderTrees(){
  var el=document.getElementById("treesList");
  el.innerHTML="";
  if(state.pouring.active&&state.trees.length===0){
    el.innerHTML='<p class="muted">لا توجد أشجار بعد. أضف أول شجرة لهذه الصبة.</p>';
    return;
  }
  for(var ti=0;ti<state.trees.length;ti++){
    (function(tree){
      var card=document.createElement("div");
      card.className="card";
      if(tree.collapsed){
        card.innerHTML=
          '<div class="row" style="justify-content:space-between;align-items:flex-start;margin:0">'+
            '<div style="flex:1;cursor:pointer" class="tog">'+
              '<h3>شجرة رقم '+tree.number+(tree.photo?' <img class="photothumb" src="'+tree.photo+'">':'')+'</h3>'+
              '<div class="cardSummary">'+treeSummary(tree)+'</div>'+
              (tree.castingLoss?'<div class="cardSummary">تلف الصبة: '+tree.castingLoss+'</div>':'')+
            '</div>'+
            '<button type="button" class="btn small danger del">✕</button>'+
          '</div>';
        card.querySelector(".tog").onclick=function(){tree.collapsed=false;save();renderTrees()};
        bindConfirm(card.querySelector(".del"),"تأكيد؟","✕",function(){
          state.trees=state.trees.filter(function(t){return String(t.id)!==String(tree.id)});
          save();renderTrees();renderActions();
        });
      } else {
        card.innerHTML=
          '<div class="row" style="justify-content:space-between">'+
            '<div style="flex:1"><label class="f">رقم الشجرة</label><input type="number" class="tnum" value="'+tree.number+'"></div>'+
            (tree.photo?'<img class="photothumb" src="'+tree.photo+'">':'')+
            '<button type="button" class="btn small tcam">📷</button>'+
            '<button type="button" class="btn small tgal">🖼</button>'+
            '<button type="button" class="btn small danger del">✕</button>'+
          '</div>'+
          '<div class="items"></div>'+
          '<div class="row">'+
            '<button type="button" class="btn small tadd">+ إضافة سطر</button>'+
            '<button type="button" class="btn primary small tsave">حفظ</button>'+
          '</div>';
        card.querySelector(".tnum").onchange=function(){tree.number=n(this.value);save()};
        card.querySelector(".tcam").onclick=function(e){e.preventDefault();pickPhoto(tree,"camera")};
        card.querySelector(".tgal").onclick=function(e){e.preventDefault();pickPhoto(tree,"gallery")};
        card.querySelector(".tadd").onclick=function(e){e.preventDefault();tree.items.push(emptyItem());save();renderTrees()};
        card.querySelector(".tsave").onclick=function(e){e.preventDefault();tree.collapsed=true;save();renderTrees()};
        bindConfirm(card.querySelector(".del"),"تأكيد؟","✕",function(){
          state.trees=state.trees.filter(function(t){return String(t.id)!==String(tree.id)});
          save();renderTrees();renderActions();
        });
        renderItems(card.querySelector(".items"),tree);
      }
      el.appendChild(card);
    })(state.trees[ti]);
  }
}

function renderItems(wrap,tree){
  wrap.innerHTML="";
  for(var i=0;i<tree.items.length;i++){
    (function(it,idx){
      var d=document.createElement("div");
      d.className="item";
      var opts="";
      for(var k=0;k<TYPES.length;k++) opts+='<option'+(it.type===TYPES[k]?' selected':'')+'>'+TYPES[k]+'</option>';
      d.innerHTML=
        '<div class="grid3">'+
          '<div><label class="f">نوع الشجرة</label><select class="itype">'+opts+'</select></div>'+
          '<div><label class="f">العدد</label><input type="number" class="icnt" value="'+it.count+'"></div>'+
          '<div><label class="f">تلف الصبة</label><input type="number" class="iloss" value="'+tree.castingLoss+'"></div>'+
        '</div>'+
        '<div class="reqbox"><label class="f">العدد المطلوب ★</label><input type="number" class="ireq" value="'+it.reqCount+'"></div>'+
        '<div class="grid2" style="margin-top:6px">'+
          '<div class="finishbox"><label><input type="checkbox" class="nchk"'+(it.normal.checked?' checked':'')+'> عادي</label>'+
            '<input type="number" class="ncnt" placeholder="العدد" value="'+it.normal.count+'"></div>'+
          '<div class="finishbox"><label><input type="checkbox" class="pchk"'+(it.padded.checked?' checked':'')+'> مبطن</label>'+
            '<input type="number" class="pcnt" placeholder="العدد" value="'+it.padded.count+'"></div>'+
        '</div>'+
        (tree.items.length>1?'<button type="button" class="btn small danger idel" style="margin-top:6px">حذف السطر</button>':'');
      d.querySelector(".itype").onchange=function(){it.type=this.value;save()};
      d.querySelector(".icnt").onchange=function(){it.count=n(this.value);save()};
      d.querySelector(".iloss").onchange=function(){tree.castingLoss=n(this.value);save()};
      d.querySelector(".ireq").onchange=function(){it.reqCount=n(this.value);save()};
      d.querySelector(".nchk").onchange=function(){it.normal.checked=this.checked;save()};
      d.querySelector(".ncnt").onchange=function(){it.normal.count=n(this.value);save()};
      d.querySelector(".pchk").onchange=function(){it.padded.checked=this.checked;save()};
      d.querySelector(".pcnt").onchange=function(){it.padded.count=n(this.value);save()};
      var del=d.querySelector(".idel");
      if(del) del.onclick=function(e){e.preventDefault();tree.items.splice(idx,1);save();renderTrees()};
      wrap.appendChild(d);
    })(tree.items[i],i);
  }
}

function bindConfirm(btn,armedText,normalText,action){
  var armed=false,timer=0;
  btn.onclick=function(e){
    e.preventDefault();
    if(armed){clearTimeout(timer);armed=false;action();return}
    armed=true;btn.textContent=armedText;
    timer=setTimeout(function(){if(btn.isConnected){armed=false;btn.textContent=normalText}},2500);
  };
}

function pickPhoto(tree,mode){
  var input=document.createElement("input");
  input.type="file"; input.accept="image/*";
  if(mode==="camera") input.setAttribute("capture","environment");
  input.onchange=function(){
    var file=input.files&&input.files[0]; if(!file) return;
    var r=new FileReader();
    r.onload=function(){
      var img=new Image();
      img.onload=function(){
        var max=640, sc=Math.min(1,max/Math.max(img.width,img.height));
        var c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(img.width*sc));
        c.height=Math.max(1,Math.round(img.height*sc));
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        tree.photo=c.toDataURL("image/jpeg",0.6);
        save(); renderTrees();
      };
      img.onerror=function(){toast("تعذّر قراءة الصورة")};
      img.src=r.result;
    };
    r.readAsDataURL(file);
  };
  input.click();
}

function renderActions(){
  var el=document.getElementById("page1Actions");
  var html='<button type="button" class="btn primary" id="btnExport">تصدير</button>'+
    '<button type="button" class="btn" id="btnImport">استعادة</button>';
  if(state.pouring.active){
    html+='<button type="button" class="btn span2" id="btnNewPour">بدء صبة جديدة</button>'+
      '<button type="button" class="btn danger span2" id="btnDelAll">حذف جميع الأشجار</button>';
  }
  el.innerHTML=html;
  document.getElementById("btnExport").onclick=function(e){e.preventDefault();exportData()};
  document.getElementById("btnImport").onclick=function(e){
    e.preventDefault();
    var input=document.createElement("input");
    input.type="file"; input.accept=".json,application/json";
    input.onchange=function(){
      var file=input.files&&input.files[0]; if(!file) return;
      var r=new FileReader();
      r.onload=function(){
        try{
          var d=JSON.parse(r.result);
          if(d.pouring) state.pouring=d.pouring;
          if(Array.isArray(d.trees)) state.trees=d.trees;
          if(d.nextTreeNum) state.nextTreeNum=d.nextTreeNum;
          if(Array.isArray(d.measurements)) state.measurements=d.measurements;
          save(); renderAll(); toast("تمت الاستعادة ✓");
        }catch(err){toast("ملف غير صالح")}
      };
      r.readAsText(file);
    };
    input.click();
  };
  var np=document.getElementById("btnNewPour");
  if(np) bindConfirm(np,"تأكيد صبة جديدة","بدء صبة جديدة",function(){
    state.trees=[]; state.nextTreeNum=1; state.pouring={active:false,date:""}; save(); renderPage1();
  });
  var da=document.getElementById("btnDelAll");
  if(da) bindConfirm(da,"تأكيد حذف الجميع","حذف جميع الأشجار",function(){
    state.trees=[]; state.nextTreeNum=1; save(); renderPage1();
  });
}

function exportData(){
  var blob=new Blob([JSON.stringify({pouring:state.pouring,trees:state.trees,nextTreeNum:state.nextTreeNum,measurements:state.measurements})],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="SN975_"+(state.pouring.date||"export")+".json";
  a.click(); URL.revokeObjectURL(a.href); toast("تم التصدير ✓");
}

function collectGroup(type, finish){
  var items=[];
  for(var a=0;a<state.trees.length;a++){
    var tree=state.trees[a];
    for(var b=0;b<tree.items.length;b++){
      var it=tree.items[b];
      if(it.type===type && it[finish] && it[finish].checked) items.push(it);
    }
  }
  return items;
}
function setGroupLoss(items, finish, field, value){
  for(var i=0;i<items.length;i++){
    items[i][finish][field] = (i===0 ? value : 0);
  }
}
function renderTables2(){
  var el=document.getElementById("tables2");
  el.innerHTML="";
  var any=false;
  for(var ti=0;ti<TYPES.length;ti++){
    var type=TYPES[ti];
    for(var fi=0;fi<2;fi++){
      var finish=fi===0?"normal":"padded";
      var items=collectGroup(type, finish);
      if(!items.length) continue;
      any=true;
      var req=0, laham=0, hazaz=0;
      for(var r=0;r<items.length;r++){
        req += items[r][finish].count||0;
        laham += items[r][finish].lossLaham||0;
        if(finish==="padded") hazaz += items[r].padded.lossHazaz||0;
      }
      var ready=req-laham-hazaz;
      var box=document.createElement("div");
      box.className="tbl2block";
      var html='<div class="tbl-title">'+type+(finish==="normal"?" عادي":" مبطن")+'</div>'+
        '<div class="sumbox"><div class="sumitem"><b>'+req+'</b><span>العدد المطلوب</span></div></div>'+
        '<div class="arrow">↓</div>'+
        '<div class="tblwrap"><table><tr><th>العدد</th>'+
        (finish==="padded"?"<th>تلف هزاز</th>":"")+
        '<th>تلف لحام</th></tr><tr>'+
        '<td><b>'+req+'</b></td>';
      if(finish==="padded"){
        html+='<td><input type="number" class="loss-in g-loss" value="'+hazaz+
          '" data-type="'+type+'" data-fin="padded" data-f="lossHazaz"></td>';
      }
      html+='<td><input type="number" class="loss-in g-loss" value="'+laham+
        '" data-type="'+type+'" data-fin="'+finish+'" data-f="lossLaham"></td>'+
        '</tr></table></div>'+
        '<div class="arrow">↓</div>'+
        '<div class="sumbox"><div class="sumitem ready"><b>'+ready+'</b><span>العدد الجاهز</span></div></div>';
      box.innerHTML=html;
      el.appendChild(box);
    }
  }
  if(!any){
    el.innerHTML='<p class="muted">لا توجد بيانات — أضف أشجاراً وحدد التشطيب في صفحة العمل.</p>';
    return;
  }
  var inputs=el.querySelectorAll(".g-loss");
  for(var i=0;i<inputs.length;i++){
    inputs[i].onchange=function(){
      var type=this.getAttribute("data-type");
      var finish=this.getAttribute("data-fin");
      var field=this.getAttribute("data-f");
      var items=collectGroup(type, finish);
      setGroupLoss(items, finish, field, n(this.value));
      save();
      renderTables2();
    };
  }
}

function measureOptions(){
  var out=[]; for(var v=5.5;v<=6.5+1e-9;v+=0.1) out.push(v.toFixed(1)); return out;
}
function renderPage3(){
  var cat=document.getElementById("cat3"), h="";
  for(var i=0;i<TYPES.length;i++){
    h+='<button type="button" class="segbtn'+(TYPES[i]===selectedCategory?" active":"")+
      '" data-cat="'+TYPES[i]+'">'+TYPES[i]+'</button>';
  }
  cat.innerHTML=h;
  var segs=cat.querySelectorAll(".segbtn");
  for(var s=0;s<segs.length;s++){
    segs[s].onclick=function(e){e.preventDefault();selectedCategory=this.getAttribute("data-cat");renderPage3()};
  }
  renderPendingAndList();
}
document.getElementById("btnAddMeasure").onclick=function(e){
  e.preventDefault();
  pending.push({id:"p"+uid(),category:selectedCategory,freeText:"",size:"كبير",measure:"5.5"});
  renderPendingAndList();
};
function renderPendingAndList(){
  var wrap=document.getElementById("entries3");
  wrap.innerHTML="";
  for(var i=0;i<pending.length;i++){
    if(pending[i].category!==selectedCategory) continue;
    (function(p){
      var d=document.createElement("div");
      d.className="item";
      var sizes=["كبير","وسط","صغير"], so="", mo="", opts=measureOptions();
      for(var a=0;a<sizes.length;a++) so+='<option'+(p.size===sizes[a]?' selected':'')+'>'+sizes[a]+'</option>';
      for(var b=0;b<opts.length;b++) mo+='<option'+(p.measure===opts[b]?' selected':'')+'>'+opts[b]+'</option>';
      d.innerHTML=
        '<div class="grid3">'+
          '<div><label class="f">النوع</label><input class="pt" value="'+(p.freeText||"")+'"></div>'+
          '<div><label class="f">الحجم</label><select class="ps">'+so+'</select></div>'+
          '<div><label class="f">القياس</label><select class="pm">'+mo+'</select></div>'+
        '</div>'+
        '<div class="row" style="margin-top:6px">'+
          '<button type="button" class="btn primary small psv">حفظ</button>'+
          '<button type="button" class="btn danger small prm">حذف</button></div>';
      d.querySelector(".pt").oninput=function(){p.freeText=this.value};
      d.querySelector(".ps").onchange=function(){p.size=this.value};
      d.querySelector(".pm").onchange=function(){p.measure=this.value};
      d.querySelector(".psv").onclick=function(e){
        e.preventDefault();
        state.measurements.push({id:uid(),category:p.category,freeText:p.freeText,size:p.size,measure:p.measure});
        pending=pending.filter(function(x){return x.id!==p.id});
        save(); renderPendingAndList();
      };
      d.querySelector(".prm").onclick=function(e){
        e.preventDefault();
        pending=pending.filter(function(x){return x.id!==p.id});
        renderPendingAndList();
      };
      wrap.appendChild(d);
    })(pending[i]);
  }
  var list=document.getElementById("measureList");
  list.innerHTML="";
  var items=[], hasPending=false;
  for(var m=0;m<state.measurements.length;m++) if(state.measurements[m].category===selectedCategory) items.push(state.measurements[m]);
  for(var p=0;p<pending.length;p++) if(pending[p].category===selectedCategory) hasPending=true;
  if(!items.length&&!hasPending) list.innerHTML='<p class="muted">لا توجد قياسات بعد لهذا النوع</p>';
  for(var x=0;x<items.length;x++){
    var line=document.createElement("div");
    line.className="measline";
    line.innerHTML='<span>'+items[x].category+(items[x].freeText?" "+items[x].freeText:"")+" "+items[x].size+
      '</span><span class="val">'+items[x].measure+'</span>';
    list.appendChild(line);
  }
}

function renderPage1(){ renderPourControls(); renderTrees(); renderActions(); }
function renderAll(){ renderPage1(); renderTables2(); renderPage3(); }

load();
renderAll();
setTimeout(function(){
  pullFromCloud(function(changed){ if(changed) renderAll(); });
}, 300);

window.addEventListener("online", function(){
  toast("عاد الاتصال — جارِ المزامنة…");
  if(hasDirty) pushToCloud(true);
  else pullFromCloud(function(changed){ if(changed) renderAll(); });
});

window.addEventListener("offline", function(){
  setSyncStatus("وضع أوفلاين — يتم الحفظ محليًا تلقائيًا","pending");
});

document.getElementById("btnSyncNow").onclick=function(){
  if(!navigator.onLine){
    toast("لا يوجد اتصال بالإنترنت — بياناتك محفوظة محليًا");
    return;
  }
  if(hasDirty) pushToCloud(true);
  else pullFromCloud(function(changed){
    if(changed){ renderAll(); toast("تم تحديث البيانات من السحابة ✓"); }
    else { pushToCloud(true); }
  });
};
})();
